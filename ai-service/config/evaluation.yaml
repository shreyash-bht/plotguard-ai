database:
  url: ${EVALUATION_DATABASE_URL:postgresql://postgres:admin@localhost:5433/postgres}

ollama:
  base_url: ${OLLAMA_BASE_URL:http://localhost:11434}

embedding:
  model: ${EMBEDDING_MODEL:qwen3-embedding:0.6B}

chat_llm:
  provider: ${CHAT_LLM_PROVIDER:gemini}

  gemini:
    model: ${GEMINI_LLM_MODEL:gemini-3.1-flash-lite}
    api_key: ${GEMINI_API_KEY}

  ollama:
    model: ${OLLAMA_CHAT_LLM_MODEL:qwen2.5:3b}

  openrouter:
    model: ${OPENROUTER_CHAT_LLM_MODEL:openai/gpt-4o-mini}
    api_key: ${OPENROUTER_API_KEY:}
    base_url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}

contextualizer:
  provider: ${CONTEXTUALIZER_PROVIDER:ollama}

  gemini:
    model: ${GEMINI_LLM_MODEL:gemini-3.1-flash-lite}
    api_key: ${GEMINI_API_KEY}

  ollama:
    model: ${OLLAMA_CONTEXTUALIZER_MODEL:qwen2.5:1.5b}

  openrouter:
    model: ${OPENROUTER_CONTEXTUALIZER_MODEL:openai/gpt-4o-mini}
    api_key: ${OPENROUTER_API_KEY:}
    base_url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}

retrieval:
  enable_reranking: ${ENABLE_RERANKING:true}